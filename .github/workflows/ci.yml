name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS-only tool (Trash, Finder, Darwin stat) — run where it runs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build -o macclean .
